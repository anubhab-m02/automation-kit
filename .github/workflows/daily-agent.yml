name: Daily Agent Task Runner

# Reusable workflow. Consumer repos call this via:
#   jobs:
#     run:
#       uses: anubhab-m02/automation-kit/.github/workflows/daily-agent.yml@main
#       with:
#         mode: new-issues  # or resolve-comments
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         GH_PAT: ${{ secrets.GH_PAT }}
#
# Auth: uses a Claude Pro/Max subscription OAuth token (generated locally via
# `claude setup-token`), not a metered Anthropic API key — usage draws from
# the subscription, not pay-per-token billing. GH_PAT (a fine-grained PAT
# owned by the repo owner, scoped to contents/PRs/issues read-write) makes
# PRs, comments, and labels land as the owner instead of the Claude GitHub
# App identity — set it if you don't want an app identity showing up at all.
#
# Design: independent per-issue delivery, not a shared rolling branch. Each
# attempted issue gets its own branch (`issue/<n>-<slug>`) and its own PR,
# so one issue's problem (a failed review, a blocked merge) never blocks
# another issue's progress. A separate Reviewer automation decides whether
# each PR merges — this workflow never merges anything itself.
#
# Two invocation modes, chosen via the `mode` input:
#   - `new-issues` (default): picks up to `max_issues` eligible `daily-task`
#     issues and opens one PR per issue.
#   - `resolve-comments`: finds open PRs with review changes requested and
#     pushes fixes to their existing branches. Never picks up new issues.
#     Meant to be triggered by the Reviewer's own completion, not scheduled
#     independently — see the automation org design doc.
#
# Issue labels this convention relies on (create these in the consumer
# repo): daily-task, priority, in-pr, needs-input, needs-triage.

on:
  workflow_call:
    inputs:
      max_turns:
        description: "Max agent turns per run (budget cap)"
        required: false
        type: number
        default: 150
      max_issues:
        description: "Max issues to attempt in one new-issues run"
        required: false
        type: number
        default: 3
      mode:
        description: "'new-issues' (default) or 'resolve-comments'"
        required: false
        type: string
        default: "new-issues"
      random_window_minutes:
        description: >-
          On scheduled (cron) runs only, sleep a random amount up to this many
          minutes before doing anything, so the actual work-start time varies
          day to day instead of landing at a fixed clock time. Set the cron
          trigger to the start of your target window and this to the window's
          length. Ignored on manual (workflow_dispatch) runs.
        required: false
        type: number
        default: 180
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_PAT:
        required: false

jobs:
  find-task:
    if: inputs.mode == 'new-issues'
    runs-on: ubuntu-latest
    outputs:
      has_task: ${{ steps.pick.outputs.has_task }}
      candidates: ${{ steps.pick.outputs.candidates }}
    steps:
      - name: Randomize start time within the target window
        if: github.event_name == 'schedule'
        env:
          WINDOW_MINUTES: ${{ inputs.random_window_minutes }}
        run: |
          set -euo pipefail
          sleep_secs=$(( RANDOM % (WINDOW_MINUTES * 60) ))
          echo "Sleeping ${sleep_secs}s (up to ${WINDOW_MINUTES}m window) before starting..."
          sleep "$sleep_secs"

      - name: Pick eligible daily-task issues
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_ISSUES: ${{ inputs.max_issues }}
        run: |
          set -euo pipefail

          # Eligible: open + daily-task, minus in-pr, minus needs-input.
          # Priority-labeled issues first, then lowest issue number.
          # --limit is required: gh issue list defaults to 30 results sorted
          # newest-created-first, which silently drops the oldest (lowest-
          # numbered, highest-priority) issues once the backlog grows past
          # 30 — exactly the issues this picker is supposed to favor.
          all=$(gh issue list --repo "${{ github.repository }}" \
            --label daily-task --state open --limit 1000 \
            --json number,title,labels)

          eligible=$(echo "$all" | jq -c '
            [ .[] | select(
                (.labels | map(.name) | index("in-pr") | not) and
                (.labels | map(.name) | index("needs-input") | not)
              ) ]
            | sort_by(.number)
            | (map(select(.labels | map(.name) | index("priority"))) +
               map(select(.labels | map(.name) | index("priority") | not)))
          ')

          candidates=$(echo "$eligible" | jq -c --argjson n "$MAX_ISSUES" '[.[:$n][] | {number, title}]')
          count=$(echo "$candidates" | jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "No eligible daily-task issues — skipping run."
            echo "has_task=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_task=true" >> "$GITHUB_OUTPUT"
            echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          fi

  run-agent:
    needs: find-task
    if: inputs.mode == 'new-issues' && needs.find-task.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          bot_name: ${{ github.repository_owner }}
          bot_id: ${{ github.repository_owner_id }}
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gh *),Bash(npm *),Bash(pip *),Bash(pytest *),Bash(python *),Bash(ls *),Bash(cat *),Bash(find *),Bash(mkdir *),Bash(mv *)"
          prompt: |
            You are the unattended daily contributor for this repository. Each issue
            you attempt gets its OWN branch and its OWN pull request — not a shared
            branch — so that one issue's problem never blocks another's.

            Candidate issues, in the order you should attempt them (priority-labeled
            issues first, then lowest number first):
            ${{ needs.find-task.outputs.candidates }}

            Ground rules:
            1. Read CLAUDE.md, ROADMAP.md, and docs/ARCHITECTURE.md first for project
               context and conventions. For each issue, read only the files it
               references or that are clearly required to implement it.
            2. For EACH issue you attempt: fetch and check out the default branch
               fresh, create a new branch named `issue/<number>-<short-slug>` from
               it (never branch from a previous issue's branch in this same run),
               implement ONLY that issue's scope, commit it as its own small set of
               logically separate commits, push that branch, and open a NEW pull
               request from it to the default branch with a title describing the
               actual change and a body containing `Closes #<number>`. Do not touch
               any other issue's branch or PR.
            3. Complete between 1 and ${{ inputs.max_issues }} issues, stopping
               cleanly after finishing your current issue if running low on turn
               budget — never leave an issue half-implemented, and never leave a
               half-pushed branch with no PR opened for it.
            4. Do NOT merge anything yourself. Opening the PR is the end of your
               responsibility for that issue — a separate Reviewer automation decides
               whether it merges.
            5. Do not add any AI/bot attribution to commits, PR bodies, or issue
               comments. Git identity is already configured to the repository owner.
            6. If a candidate issue has a genuine ambiguity, a design decision only a
               human should make, a missing credential, a new dependency or tech
               stack being considered, or anything with a real or potential cost:
               stop working on that issue specifically, comment on it explaining
               what's needed, label it `needs-input`, and move on to the next
               candidate. Do not guess on judgment calls, and do not notify anyone
               directly — the Brainstormer automation is solely responsible for
               surfacing this to the human, on its own schedule.
            7. If, while implementing an issue, you notice one clearly-scoped piece of
               genuinely meaningful follow-up work, you may open at most ONE new
               issue for the whole run, labeled `needs-triage`, never `daily-task`
               directly.
            8. Keep each issue's diff proportional to its scope.

  resolve-review-comments:
    if: inputs.mode == 'resolve-comments'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Find PRs with requested changes
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number,reviewDecision \
            --jq '[.[] | select(.reviewDecision == "CHANGES_REQUESTED") | .number]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.find.outputs.prs != '[]'
        with:
          fetch-depth: 0

      - name: Configure git identity
        if: steps.find.outputs.prs != '[]'
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"

      - name: Resolve feedback on each flagged PR
        if: steps.find.outputs.prs != '[]'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          bot_name: ${{ github.repository_owner }}
          bot_id: ${{ github.repository_owner_id }}
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gh *),Bash(npm *),Bash(pip *),Bash(pytest *),Bash(python *)"
          prompt: |
            PRs with requested changes: ${{ steps.find.outputs.prs }}

            For each one: check out its branch, read the review comments via
            `gh pr view <n> --repo ${{ github.repository }}` (its body carries the
            Reviewer's stated reason) and `gh api repos/${{ github.repository }}/pulls/<n>/reviews`
            for the full review history, address the specific feedback, commit, and
            push to the SAME branch — do not open a new PR, the existing one updates
            automatically. Do not pick up any new issues in this run.
